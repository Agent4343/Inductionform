name: DigitalFormsApp
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DigitalFormsApp:
    type: application
    platform: iOS
    sources:
      - path: DigitalFormsApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.digitalforms
        INFOPLIST_FILE: DigitalFormsApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: DigitalFormsApp/DigitalFormsApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: DigitalFormsApp/Info.plist
      properties:
        CFBundleDisplayName: DigitalForms
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Camera is used for photos, document scanning, and barcode scanning
        NSPhotoLibraryUsageDescription: Photo library access is needed to attach images to forms
        NSLocationWhenInUseUsageDescription: Location is captured for audit trail and form verification
        NSMicrophoneUsageDescription: Microphone is used for voice-to-text input
        NSSpeechRecognitionUsageDescription: Speech recognition enables hands-free form filling
        NSFaceIDUsageDescription: Face ID secures access to your forms
    entitlements:
      path: DigitalFormsApp/DigitalFormsApp.entitlements
      properties:
        com.apple.developer.siri: true
        aps-environment: development

schemes:
  DigitalFormsApp:
    build:
      targets:
        DigitalFormsApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
